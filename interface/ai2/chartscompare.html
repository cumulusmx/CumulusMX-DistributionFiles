    <body class="ow-theme9">
        <header id="pageHead" class="ow-theme5" style="min-height: 6em;">
            <img src="img/flying-gull.png" alt="Gull" id="headImg" class="gull">
            <section class="subHead">
                <img src="img/AI-Logo.png" id="#siteLogo" alt="CumulusMX AI Logo" class="siteLogo" style="padding:1vh 0 .5vh 0;">
                <div class="stationName"><span data-cmxData="location">Site Name</span><span class="ow-smaller">&nbsp;on <span data-cmxData="Port">--</span></span></div>
                <div class="siteInfo">
                    <p>{{LATITUDE}}:</p>
                    <p><span data-cmxData="latitude">N 179&deg; 59' 59"</span></p>
                    <p>{{LONGITUDE}}:</p>
                    <p><span data-cmxData="longitude">W 179&deg; 59' 59"</span></p>
                    <p>{{ALTITUDE}}:</p>
                    <p><span data-cmxData="altitude">5000 m</span></p>
                </div>
                <i id="NavBars" class="fa-solid fa-bars" aria-controls="mySideNav" aria-label="Navigation"
                    onClick="toggleSideNav();"></i>
            </section>
            <nav id="myTopNav" class="topNav" style="min-height:2.1em; max-width:var(--pageWidth-px);margin:auto;color:var(--color9)">
                <div class="theMenu"></div>
                <i class="fa-solid fa-bars ow-theme7-txt-hvr icon" style="margin-top:.5em;" aria-controls="topNav" onClick="toggleTopNav();"></i>
            </nav>
        </header>

        <main id="pageContent">

                <p style="position:absolute;bottom: 0;left:1em;color:var(--color5);display:none;">Oaktree Weather Systems</p>
				<a class="ow-even-smaller backtotop" style="text-align:right;" href="#closeBtn">Back to top</a>
            </nav><!-- End of Sidebar Naviation-->
            <section class="subContent"><!-- Main Page Content -->
                <section id="pageTitle" style="padding-bottom:0;"><!-- Page Title -->
                    <div class="ow-titleBar">
                        <h1>{{COMPARISON_CHARTS}}</h1>
                        <p class="ow-tagline">Charts are based on your stations readings.</p>
                    </div>
                </section><!-- End Title area -->
				
				<section class="ow-grid col1">
					<div class="ow-panel ow-shadow-none" style="padding-bottom:0; order:1;"><!-- Selector buttons -->
						<div class="ow-titleBar" style="background: var(--color0);"><!--	Places button groups either side	-->
							<div class="ow-btnBar" style="column-gap: 0.5em; justify-content: flex-start;">
								<div class="ow-selectaGrid">
									<select name="data0" id="data0" aria-label="Choose graph" onChange="procDataSelect(this)"></select>
									<select name="colour0" id="colour0"  aria-label="Select its colour" onchange="updateColour(this)"></select>
								</div>
								<div class="ow-selectaGrid">
									<select name="data1" id="data1" aria-label="Choose graph"  onchange="procDataSelect(this)"></select>
									<select name="colour1" id="colour1" aria-label="Select its colour" onchange="updateColour(this)"></select>
								</div>
								<div class="ow-selectaGrid">
									<select name="data2" id="data2" aria-label="Choose graph" onchange="procDataSelect(this)"></select>
									<select id="colour2" aria-label="Select its colour" onchange="updateColour(this)"></select>
								</div>
							</div>
							<div class="ow-btnBar" style="column-gap:0.5em; justify-content: flex-end;">
								<div class="ow-selectaGrid">
									<select name="data3" id="data3" aria-label="Choose graph" onchange="procDataSelect(this)"></select>
									<select name="colour3" id="colour3" aria-label="Select its colour" onchange="updateColour(this)"></select>
								</div>
								<div class="ow-selectaGrid">
									<select name="data4" id="data4" aria-label="Choose graph" onchange="procDataSelect(this)"></select>
									<select name="colour4" id="colour4" aria-label="Select its colour" onchange="updateColour(this)"></select>
								</div>
								<div class="ow-selectaGrid">
									<select name="data5" id="data5" aria-label="Choose graph" onchange="procDataSelect(this)"></select>
									<select name="colour5" id="colour5" aria-label="Select its colour" onchange="updateColour(this)"></select>
								</div>
							</div>
						</div>
					</div><!-- End Selector Buttons -->

                    <div class="ow-panel" style="order:1;"><!-- Chart Container -->
						<div id="chartcontainer" class="chart-wrap" style="margin-top:1vh;">
        			        <div class="chart-buttons">
                    			<div id="rangeButtons"></div>
								<div>
									<button id="btnPrint">{{PRINT}}</button>
									<button id="btnFullscreen">{{FULLSCREEN}}</button>
								</div>
                			</div>
                			<div id="mainChartContainer" class="mainChartContainer">
                    			<canvas id="mainChart"></canvas>
                			</div>
                			<div id="navChartContainer" class="navChartContainer">
                    			<canvas id="navChart"></canvas>
                			</div>
            			</div>
					</div><!-- End Chart Container -->
