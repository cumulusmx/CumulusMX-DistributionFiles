<html lang="en">
    <head>
        <meta charset="utf-8">

		<title>{{HISTORIC_CHARTS}} - CMX-AI</title>
		<link rel="icon" type="image/png" href="img/ai-favicon.png">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="" id="metaDescription">
		<meta name="author" content="DNC Thomas 2026">

        <!--	Fonts	-->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Red+Rose:wght@300..700&display=swap" rel="stylesheet">

		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" >
		
		<!--	jQuery (CDN)	-->
		<!--<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js" integrity="sha512-3gJwYpMe3QewGELv8k/BX9vcqhryRdzRMxVfq6ngyWXwo03GFEzjsUm8Q7RZcHPHksttq7/GFoxjCVUjkjvPdw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>-->
        <!--    jQuery (Local)  -->
        <script src="/lib/jquery/jquery-latest.min.js"></script>
		<script src="/lib/jquery/jquery.tmpl.js"></script>

        <!-- ChartJS -->
    	<script src="/lib/chartjs/chart.umd.min.js"></script>
    	<script src="/lib/luxon/luxon.min.js"></script>
    	<script src="/lib/chartjs/chartjs-adapter-luxon.umd.min.js"></script>

        <!--    Site Styles     -->
        <link rel="stylesheet" href="./css/ai-normalise.css">
        <link rel="stylesheet" href="./css/ai-theme.css" id="Theme">
        <link rel="stylesheet" href="./css/ai-main.css">

        <!--    Site Scripts    -->
        <script src="./js/ai-settings.js?now=999999999999"></script>
        <script src="js/ai-page-ctrl.js"></script>
        
        <!--    Page Styles     -->
        <link rel="stylesheet" href="css/ai-charts.css">
        <style>
        </style>
        <!--    Page Scripts    -->
        <script src="js/ai-chartshistoric.js"></script>	<!-- 	Local Script	-->
		<script src="/js/chartjsextras.js"></script>	<!--	Script needed to run charts	-->
        <script>

        </script>
    </head>
    <body class="ow-theme9">
        <header id="pageHead" class="ow-theme5" style="min-height: 6em;">
            <img src="img/flying-gull.png" alt="Gull" id="headImg" class="gull">
            <section class="subHead">
                <img src="img/AI-Logo.png" id="#siteLogo" alt="CumulusMX AI Logo" class="siteLogo" style="padding:1vh 0 .5vh 0;">
                <div class="stationName"><span data-cmxData="location">Site Name</span><span class="ow-smaller">&nbsp;on <span data-cmxData="Port">--</span></span></div>
                <div class="siteInfo">
                    <p>{{LATITUDE}}:</p>
                    <p><span data-cmxData="latitude">N 179&deg; 59' 59"</span></p>
                    <p>{{LONGITUDE}}:</p>
                    <p><span data-cmxData="longitude">W 179&deg; 59' 59"</span></p>
                    <p>{{ALTITUDE}}:</p>
                    <p><span data-cmxData="altitude">5000 m</span></p>
                </div>
                <i id="NavBars" class="fa-solid fa-bars" aria-controls="mySideNav" aria-label="Navigation"
                    onClick="toggleSideNav();"></i>
            </section>
            <nav id="myTopNav" class="topNav" style="min-height:2.1em; max-width:var(--pageWidth-px);margin:auto;color:var(--color9)">
                <div class="theMenu"></div>
                <i class="fa-solid fa-bars ow-theme7-txt-hvr icon" style="margin-top:.5em;" aria-controls="topNav" onClick="toggleTopNav();"></i>
            </nav>
        </header>

        <main id="pageContent">
            <!--    Sidebar Navigation - Please do NOT modify the following <div> element -->
            <nav id="mySideNav" class="sideNav" role="menu">
                <a href="#" class="closebtn" name="closeBtn" onclick="toggleSideNav()">&times;</a>
                <img src="./img/flying-gull.png" alt="Flying owl" class="menuOwl">
                <div class="theMenu"></div>
                <p style="position:absolute;bottom: 0;left:1em;color:var(--color5);display:none;">Oaktree Weather Systems</p>
                <a class="ow-even-smaller backtotop" style="text-align:right;" href="#closeBtn">Back to top</a>
            </nav>
            <section class="subContent">
                <section id="pageTitle">
                    <div class="ow-titleBar">
                        <h1>{{HISTORIC_CHARTS}}</h1>
                        <p class="ow-tagline">{{PAGE_UPDATED}}: <span data-cmxData="update"></span></p>
                    </div>
                </section>

				<section class="ow-grid col1"><!-- Main content as singlel column -->
					<div class="ow-panel ow-shadow-none" style="background:var(--color0);order:1"><!-- Buttons-->
						<div class="ow-btnBar">
							<button id="temp" aria-label="Temperatures">{{TEMPERATURE}}</button>
							<button id="press" aria-label="Pressure">{{PRESSURE}}</button>
							<button id="wind" aria-label="Wind speeds">{{WIND_SPEED}}</button>
							<button id="windDir" aria-label="Wind direction">{{WIND_DIRECTION}}</button>
							<button id="humidity" aria-label="Humidity">{{HUMIDITY}}</button>
							<button id="rain" aria-label="Rainfall">{{RAINFALL}}</button>
							<button id="solar" aria-label="Solar">{{SOLAR}}</button>
							<button id="degdays" aria-label="Degree days" >{{DEGREE_DAYS}}</button>
							<button id="tempsum" aria-label="Temperature summation">{{TEMP_SUM}}</button>
							<button id="chillhrs" aria-label="Chill hours">{{CHILL_HOURS}}</button>
							<button id="snow" aria-label="Snowfall">{{SNOWFALL}}</button>
						</div>
					</div><!-- End buttons -->

                    <div class="ow-panel" style="order:1;"><!-- Chart Panel -->
                        <div id="chartcontainer" class="chart-wrap" style="margin-top:1vh">
							<div class="chart-buttons">
								<div id="rangeButtons"></div>
								<div>
                        			<button id="btnPrint">{{PRINT}}</button>
                        			<button id="btnFullscreen">{{FULLSCREEN}}</button>
                    			</div>
                			</div>
							<div id="mainChartContainer" class="mainChartContainer">
                    			<canvas id="mainChart"></canvas>
                			</div>
							<div id="navChartContainer" class="navChartContainer">
                    			<canvas id="navChart"></canvas>
                			</div>
						</div>
                    </div><!-- End Chart panel -->

                    <div class="ow-panel ow-shadow-none" style="order:3;">
					    <p class="ow-center" id="chartdescription">Description</p>
				    </div>
				</section>
			</section>
		</main>
	
        <footer id="pageFoot" class="ow-theme5">
            <img src="img/flying-gull.png" alt="Gull" id="footImg" class="gull">
            <img src="img/Gull.png" alt="Gull standing" class="gullStanding">
            <section class="subFoot" class="ow-theme4">
                <p>{{SITE_DESIGN}}: <span class="ow-theme9-txt">Oaktree Weather</span> Version: <span data-owData="Version">--</span></p>
                <p>{{POWERED_BY}} <span class="ow-theme9-txt">CumulusMX</span> <span data-cmxData="Version">--</span> <span data-cmxData="Build" class="ow-smaller">--</span></p>
            </section>
        </footer>
	</body>
</html>
