<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{SIMPLE_REPORTS}} - Cumulus MX</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">

    <link href="css/main.css" rel="stylesheet">

    <!-- menu -->
    <script src="js/menu.js"></script>

    <!-- jquery -->
    <script src="lib/jquery/jquery-latest.min.js"></script>
    <script src="lib/jquery/jquery.tmpl.js"></script>

    <!-- Bootstrap -->
    <link href="lib/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="lib/bootstrap/css/bootstrap-theme.min.css" rel="stylesheet" />
    <script src="lib/bootstrap/js/bootstrap.min.js"></script>

    <!-- Custom Files -->
    <script src="js/simplereports.js"></script>

    <link href="css/cumulus.css" rel="stylesheet">
    <link href="css/simplereports.css" rel="stylesheet">
</head>
<body>
    <!-- NAVIGATION MENU -->
    <div class="navbar-nav navbar-inverse navbar-fixed-top">
        <div class="container">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse">
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
            </div>
            <nav class="navbar-collapse collapse">
                <ul id="Main_Menu" class="nav navbar-nav"></ul>
            </nav><!--/.nav-collapse -->
        </div>
    </div>
    <!-- END NAVIGATION MENU -->

    <main class="container">
        <div class="row top-buffer">
            <div class="col-sm-12 col-lg-10">
                <h1>{{SIMPLE_REPORTS}}</h1>
                <div>
                    {{SELECT_REPORT}}:&nbsp;
                    <select id="datepicker" aria-label="select report" onchange="ChangeReport(event)">
                        <option disabled selected value>{{SELECT_REPORT}}</option>
                        <option value="temp">{{TEMPERATURE}}</option>
                        <option value="rain">{{RAINFALL}}</option>
                        <option value="windrun">{{WIND_RUN}}</option>
                        <option value="sunshine">{{SUNSHINE_HOURS}}</option>
                        <option value="et">{{EVAPOTRANSPIRATION}}</option>
                        <option value="dry">{{DRY_DAYS}}</option>
                        <option value="wet">{{WET_DAYS}}</option>
                    </select><br>
                    <label for="cbFormat" onchange="FormatChange(event)">
                        <input id="cbFormat" type="checkbox"> {{REPORT_FORMAT}}
                    </label>
                </div>
            </div>
        </div>
        <div class="row top-buffer">
            <div class="col-sm-12 col-lg-10">
                {{SIMPLE_REPORTS_NOTE}}
            </div>
        </div>

        <div class="row top-buffer">
            <div class="col-sm-12 col-lg-10">
                <div class="report-container" id="report">
                </div>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer id="footerwrap">
        <div class="container">
            <div class="row">
                <div class="col-sm-12 col-lg-12">
                    <!--<p><img src="img/logo.png" alt=""></p>-->
                    <p>Cumulus MX <span id="Version"></span>&nbsp;b<span id="Build"></span></p>
                </div>
            </div><!-- /row -->
        </div><!-- /container -->
    </footer><!-- /footerwrap -->
</body>
</html>
